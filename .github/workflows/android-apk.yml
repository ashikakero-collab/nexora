name: Android APK

on:
  push:
    branches: [flutter]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi --tree-shake-icons

      - name: Build universal APK
        run: flutter build apk --release --tree-shake-icons

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/ || true
          cp build/app/outputs/flutter-apk/app-release.apk dist/nexora-universal-release.apk
          for f in dist/app-*-release.apk; do mv "$f" "dist/nexora-${f#dist/app-}"; done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-apks-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v${{ github.run_number }}
          name: NEXORA Flutter build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist/*.apk
