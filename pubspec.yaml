name: nexora
description: NEXORA — a connected cosmic digital universe (offline-first full pack).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flame: ^1.22.0
  supabase_flutter: ^2.15.4
  livekit_client: 2.3.6
  image_picker: 1.1.2
  audioplayers: ^6.1.0
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.4
  video_player: 2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

